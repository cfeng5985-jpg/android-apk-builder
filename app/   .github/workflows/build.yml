name: Build Legado APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 清理旧示例代码并解压你的源码
      run: |
        # 删除仓库里原有的 wasishah33 示例代码（防止冲突）
        rm -rf app gradle docs .github .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat
        # 解压你上传的 legado-3.26081121.zip
        unzip -o legado-3.26081121.zip
        # 如果解压后多了一层同名文件夹，把里面的文件全部挪到根目录
        if [ -d legado-3.26081121 ] && [ -f legado-3.26081121/gradlew ]; then
          mv legado-3.26081121/* ./
          mv legado-3.26081121/.* ./ 2>/dev/null || true
        fi
        chmod +x gradlew

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
