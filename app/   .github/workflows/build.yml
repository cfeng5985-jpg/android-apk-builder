name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 清理旧文件并解压你的源码
      run: |
        # 删除 wasishah33 的旧示例代码（保留你的 zip）
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat
        # 解压你的 legado-3.26081121.zip
        unzip -o legado-3.26081121.zip
        # 如果解压后多了一层同名文件夹，把内容移到根目录
        if [ -d legado-3.26081121 ]; then
          mv legado-3.26081121/* ./
          rm -rf legado-3.26081121
        fi
        chmod +x gradlew

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
