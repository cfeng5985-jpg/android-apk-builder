name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  # 虽然 v4 也有警告，但暂时可用，保留

    - name: Set up JDK 17
      uses: actions/setup-java@v5   # 升级到 v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 清理旧文件并解压
      run: |
        # 删除旧文件（保留 .git 和 .github）
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat
        # 检查 zip 是否存在
        if [ ! -f legado-3.26081121.zip ]; then
          echo "❌ legado-3.26081121.zip 未找到！"
          exit 1
        fi
        # 解压
        unzip -o legado-3.26081121.zip
        if [ $? -ne 0 ]; then
          echo "❌ 解压失败！"
          exit 1
        fi
        # 如果解压出同名文件夹，移动内容到根目录
        if [ -d legado-3.26081121 ]; then
          shopt -s dotglob
          mv legado-3.26081121/* ./
          rm -rf legado-3.26081121
        fi
        # 设置权限
        chmod +x gradlew 2>/dev/null || echo "⚠️ gradlew 不存在"
        # 输出调试信息
        echo "=== 根目录文件 ==="
        ls -la
        echo "=== app 目录内容 ==="
        ls -la app/ || echo "❌ app 目录不存在"

    - name: 编译 Debug APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        else
          echo "❌ gradlew 不存在，退出"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
