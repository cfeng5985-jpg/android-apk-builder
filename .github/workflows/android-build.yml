name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 找到 zip → 复制 → 删旧文件 → 解压 → 移文件（跳过 .github）
      run: |
        ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ 未找到 legado-*.zip 文件！"
          exit 1
        fi
        echo "✅ 找到 zip 文件：$ZIP_FILE"
        cp "$ZIP_FILE" ./legado-src.zip
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat settings.gradle
        unzip -o legado-src.zip
        rm -f legado-src.zip
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          echo "✅ 发现解压文件夹：$EXTRACTED_DIR"
          shopt -s dotglob
          for item in "$EXTRACTED_DIR"/*; do
            basename=$(basename "$item")
            if [ "$basename" != ".github" ] && [ "$basename" != ".git" ]; then
              mv "$item" ./
            else
              echo "⏭️ 跳过 $basename"
            fi
          done
          rm -rf "$EXTRACTED_DIR"
        fi
        chmod +x gradlew 2>/dev/null || echo "⚠️ gradlew 不存在"
        echo "=== 根目录内容 ==="
        ls -la

    - name: 修补缺失颜色 + 提升 minSdk + 启用 Desugaring
      run: |
        # 1. 修补缺失的颜色
        find . -name "colors.xml" -type f | while read -r colorfile; do
          if ! grep -q "name=\"colorPrimary\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorPrimary">#3F51B5</color>' "$colorfile"
          fi
          if ! grep -q "name=\"colorPrimaryDark\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorPrimaryDark">#303F9F</color>' "$colorfile"
          fi
          if ! grep -q "name=\"colorAccent\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorAccent">#FF4081</color>' "$colorfile"
          fi
        done

        # 2. 修改 gradle.properties（已删除会导致 AGP 8.x 崩溃的废弃配置 android.enableR8 / android.enableD8）
        # if [ -f gradle.properties ]; then
        #   echo "android.enableR8=false" >> gradle.properties
        #   echo "android.enableD8=false" >> gradle.properties
        # fi

        # 3. 修改 app/build.gradle：提升 minSdk + 添加 desugaring
        if [ -f app/build.gradle ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' app/build.gradle
          # 在 android { compileOptions { 中添加 coreLibraryDesugaringEnabled
          if ! grep -q "coreLibraryDesugaringEnabled" app/build.gradle; then
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' app/build.gradle
          fi
          # 在 dependencies 中添加 desugaring 依赖
          if ! grep -q "desugar_jdk_libs" app/build.gradle; then
            sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.3"' app/build.gradle
          fi
        fi

    - name: 编译 Debug APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace --info
        else
          echo "❌ gradlew 不存在，退出"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
