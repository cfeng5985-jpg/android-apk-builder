name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 找到 zip → 复制到根目录 → 删旧文件 → 解压
      run: |
        # 第一步：在整个仓库中搜索 legado-*.zip（先别删东西）
        ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ 未找到 legado-*.zip 文件！"
          exit 1
        fi
        echo "✅ 找到 zip 文件：$ZIP_FILE"
        
        # 第二步：把 zip 复制到根目录（防止后面被删）
        cp "$ZIP_FILE" ./legado-src.zip
        
        # 第三步：现在可以放心删除旧示例代码了（包括 app 文件夹）
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat settings.gradle
        
        # 第四步：解压刚才复制到根目录的 zip
        unzip -o legado-src.zip
        rm -f legado-src.zip
        
        # 第五步：如果解压出 legado-* 文件夹，把内容移到根目录
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          echo "✅ 发现解压文件夹：$EXTRACTED_DIR"
          shopt -s dotglob
          mv "$EXTRACTED_DIR"/* ./
          rm -rf "$EXTRACTED_DIR"
        fi
        
        # 第六步：设置权限
        chmod +x gradlew 2>/dev/null || echo "⚠️ gradlew 不存在"
        echo "=== 根目录内容 ==="
        ls -la

    - name: 编译 Debug APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        else
          echo "❌ gradlew 不存在，退出"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
