name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 清理旧文件并解压你的源码
      run: |
        # 彻底删除所有非隐藏的旧文件（保留 .git 和 .github）
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat
        # 解压你的包
        unzip -o legado-3.26081121.zip
        # 如果解压后多了一层同名文件夹，把内容全部移到根目录（包括隐藏文件）
        if [ -d legado-3.26081121 ]; then
          shopt -s dotglob
          mv legado-3.26081121/* ./
          rm -rf legado-3.26081121
        fi
        # 确保 gradlew 可执行
        chmod +x gradlew
        chmod +x gradlew.bat 2>/dev/null || true
        # 显示当前目录，便于调试
        echo "=== 当前目录内容 ==="
        ls -la
        echo "=== 检查 app 目录 ==="
        ls -la app/ || echo "⚠️ app 目录不存在"

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
