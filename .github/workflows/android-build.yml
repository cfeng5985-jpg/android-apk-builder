name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 找到 zip → 复制 → 删旧文件 → 解压 → 移文件（跳过 .github）
      run: |
        # 1. 找到 legado-*.zip
        ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ 未找到 legado-*.zip 文件！"
          exit 1
        fi
        echo "✅ 找到 zip 文件：$ZIP_FILE"
        
        # 2. 复制到根目录
        cp "$ZIP_FILE" ./legado-src.zip
        
        # 3. 删除旧示例代码（确保根目录干净）
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat settings.gradle
        
        # 4. 解压
        unzip -o legado-src.zip
        rm -f legado-src.zip
        
        # 5. 找到解压出来的 legado-* 文件夹
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          echo "✅ 发现解压文件夹：$EXTRACTED_DIR"
          # 移动内容到根目录，但跳过 .github 文件夹（避免覆盖 workflows）
          shopt -s dotglob
          for item in "$EXTRACTED_DIR"/*; do
            basename=$(basename "$item")
            # 跳过 .github 和 .git 文件夹
            if [ "$basename" != ".github" ] && [ "$basename" != ".git" ]; then
              mv "$item" ./
            else
              echo "⏭️ 跳过 $basename（保留现有）"
            fi
          done
          rm -rf "$EXTRACTED_DIR"
        fi
        
        # 6. 确保 gradlew 可执行
        chmod +x gradlew 2>/dev/null || echo "⚠️ gradlew 不存在"
        
        # 7. 显示根目录内容（调试）
        echo "=== 根目录内容 ==="
        ls -la

    - name: 编译 Debug APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        else
          echo "❌ gradlew 不存在，退出"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
