name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 找到 zip → 复制 → 删旧文件 → 解压 → 移文件（跳过 .github）
      run: |
        ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ 未找到 legado-*.zip 文件！"
          exit 1
        fi
        echo "✅ 找到 zip 文件：$ZIP_FILE"
        cp "$ZIP_FILE" ./legado-src.zip
        rm -rf app docs gradle .gitignore CONTRIBUTING.md LICENSE README.md build.gradle gradle.properties gradlew gradlew.bat settings.gradle
        unzip -o legado-src.zip
        rm -f legado-src.zip
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          echo "✅ 发现解压文件夹：$EXTRACTED_DIR"
          shopt -s dotglob
          for item in "$EXTRACTED_DIR"/*; do
            basename=$(basename "$item")
            if [ "$basename" != ".github" ] && [ "$basename" != ".git" ]; then
              mv "$item" ./
            else
              echo "⏭️ 跳过 $basename"
            fi
          done
          rm -rf "$EXTRACTED_DIR"
        fi
        chmod +x gradlew 2>/dev/null || echo "⚠️ gradlew 不存在"
        echo "=== 根目录内容 ==="
        ls -la

    - name: 修补缺失颜色资源并编译 Debug APK
      run: |
        # 修补缺失的 colorPrimary, colorPrimaryDark, colorAccent
        if [ -f app/src/main/res/values/colors.xml ]; then
          echo "修补颜色资源..."
          if ! grep -q "name=\"colorPrimary\"" app/src/main/res/values/colors.xml; then
            sed -i '/<\/resources>/i\    <color name="colorPrimary">#3F51B5</color>' app/src/main/res/values/colors.xml
          fi
          if ! grep -q "name=\"colorPrimaryDark\"" app/src/main/res/values/colors.xml; then
            sed -i '/<\/resources>/i\    <color name="colorPrimaryDark">#303F9F</color>' app/src/main/res/values/colors.xml
          fi
          if ! grep -q "name=\"colorAccent\"" app/src/main/res/values/colors.xml; then
            sed -i '/<\/resources>/i\    <color name="colorAccent">#FF4081</color>' app/src/main/res/values/colors.xml
          fi
        else
          echo "⚠️ colors.xml 不存在，跳过修补"
        fi
        # 开始编译
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          echo "❌ gradlew 不存在，退出"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/*.apk
