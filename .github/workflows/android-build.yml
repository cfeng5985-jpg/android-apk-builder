name: Build Legado APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 稀疏检出仅拉取源码zip，忽略仓库损坏源码
      - name: Download source zip only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            legado-*.zip
          sparse-checkout-cone-mode: false

      # JDK17，无gradle缓存（稀疏检出不兼容缓存）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 解压干净原始源码包
      - name: Unzip clean source archive
        run: |
          ls -la
          ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未找到 legado 源码压缩包！"
            exit 1
          fi
          echo "✅ 准备解压: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE"
          rm -f "$ZIP_FILE"
          EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
            shopt -s dotglob
            mv "$EXTRACTED_DIR"/* ./
            rm -rf "$EXTRACTED_DIR"
          fi
          chmod +x gradlew
          ls -la

      # 安全修补：只补颜色、移除release签名赋值，不破坏gradle括号
      - name: Safe patch config
        run: |
          find . -name "colors.xml" -type f | while read -r colorfile; do
            grep -q "name=\"colorPrimary\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorPrimary">#3F51B5</color>' "$colorfile"
            grep -q "name=\"colorPrimaryDark\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorPrimaryDark">#303F9F</color>' "$colorfile"
            grep -q "name=\"colorAccent\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorAccent">#FF4081</color>' "$colorfile"
          done

          if [ -f app/build.gradle ]; then
            sed -i 's/signingConfig = signingConfigs.myConfig//g' app/build.gradle
          fi

      # 编译Release，执行find打印所有apk路径用于调试
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --parallel --build-cache 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "===== 查找所有生成的APK ====="
          find app/build -name "*.apk"
          echo "============================"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Gradle编译失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # 无论成败上传完整编译日志
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-txt
          path: build.log

      # 修复：通配匹配flavor app文件夹下所有release APK
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-release-apk
          path: app/build/outputs/apk/**/release/*.apk
