name: Build Legado APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 只拉取仓库文件（为了拿到zip，不把错乱源码展开到工作目录）
      - name: Download zip archive only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            legado-3.26080821.zip
          sparse-checkout-cone-mode: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Unzip clean source zip
        run: |
          ls -la
          if [ ! -f "legado-3.26080821.zip" ]; then
            echo "❌ zip文件不存在"
            exit 1
          fi
          # 全部解压到当前目录，得到干净原始源码
          unzip -q -o legado-3.26080821.zip
          rm -f legado-3.26080821.zip
          # 处理如果解压出来套了一层文件夹
          EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
            shopt -s dotglob
            mv "$EXTRACTED_DIR"/* ./
            rm -rf "$EXTRACTED_DIR"
          fi
          chmod +x gradlew

      - name: Patch project config
        run: |
          find . -name "colors.xml" -type f | while read -r colorfile; do
            grep -q "name=\"colorPrimary\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorPrimary">#3F51B5</color>' "$colorfile"
            grep -q "name=\"colorPrimaryDark\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorPrimaryDark">#303F9F</color>' "$colorfile"
            grep -q "name=\"colorAccent\"" "$colorfile" || sed -i '/<\/resources>/i\    <color name="colorAccent">#FF4081</color>' "$colorfile"
          done
          if [ -f app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release//g' app/build.gradle
            sed -i '/signingConfigs {/,/}/d' app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' app/build.gradle
            grep -q "coreLibraryDesugaringEnabled" app/build.gradle || sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' app/build.gradle
            grep -q "desugar_jdk_libs" app/build.gradle || sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.3"' app/build.gradle
          fi

      - name: Build APK
        run: |
          ./gradlew assembleRelease --parallel --build-cache -q 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-txt
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-apk
          path: app/build/outputs/apk/release/*.apk
