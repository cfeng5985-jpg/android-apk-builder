name: Build Legado APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 1. 只找包，解压，然后“进入”这个目录
    - name: 找到并解压源码包，进入工作目录
      run: |
        ZIP_FILE=$(find . -name "legado-*.zip" -type f | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ 未找到 legado-*.zip 文件！"
          exit 1
        fi
        echo "✅ 找到 zip 文件：$ZIP_FILE"
        unzip -o "$ZIP_FILE" -d ./
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "legado-*" | grep -v "\./\.git" | head -n 1)
        if [ -z "$EXTRACTED_DIR" ]; then
           echo "❌ 解压后未找到源码目录！"
           exit 1
        fi
        echo "✅ 进入源码目录：$EXTRACTED_DIR"
        cd "$EXTRACTED_DIR"
        chmod +x gradlew

    # 2. 这里完整保留了你所有的“修补、配置内存、瘦身”代码（完全没动）
    - name: 修补缺失颜色、内存，开启瘦身，强制修改 minSdk 为 26
      run: |
        # 1. 修补缺失的颜色资源
        find . -name "colors.xml" -type f | while read -r colorfile; do
          if ! grep -q "name=\"colorPrimary\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorPrimary">#3F51B5</color>' "$colorfile"
          fi
          if ! grep -q "name=\"colorPrimaryDark\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorPrimaryDark">#303F9F</color>' "$colorfile"
          fi
          if ! grep -q "name=\"colorAccent\"" "$colorfile"; then
            sed -i '/<\/resources>/i\    <color name="colorAccent">#FF4081</color>' "$colorfile"
          fi
        done

        # 2. 配置更高内存
        if [ -f gradle.properties ]; then
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-XX:+UseParallelGC -Xmx8g -Xms512m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
        fi

        # 3. 全网精确查找并替换所有可能写法的 minSdk
        find . -name "build.gradle" -exec sed -i 's/minSdkVersion 23/minSdkVersion 26/g' {} \;
        find . -name "build.gradle" -exec sed -i 's/minSdk 23/minSdk 26/g' {} \;
        find . -name "build.gradle" -exec sed -i 's/minSdkVersion 21/minSdkVersion 26/g' {} \;
        find . -name "build.gradle" -exec sed -i 's/minSdk 21/minSdk 26/g' {} \;

        # 4. 在 app/build.gradle 最末尾追加强制覆盖代码
        echo "android.defaultConfig.minSdkVersion 26" >> app/build.gradle

        # 5. 开启 Multidex、启用 Desugaring
        if [ -f app/build.gradle ]; then
          if ! grep -q "multiDexEnabled" app/build.gradle; then
            sed -i '/defaultConfig {/a\        multiDexEnabled true' app/build.gradle
          fi
          if ! grep -q "coreLibraryDesugaringEnabled" app/build.gradle; then
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' app/build.gradle
          fi
          if ! grep -q "desugar_jdk_libs" app/build.gradle; then
            sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.3"' app/build.gradle
          fi
        fi

        # 6. ✨ 强制开启 Debug 版本的代码混淆和资源压缩（关键瘦身配置，没动你的）
        echo "android.buildTypes.debug.minifyEnabled true" >> app/build.gradle
        echo "android.buildTypes.debug.shrinkResources true" >> app/build.gradle
        
        # 7. 注入 Material 防混淆规则（防止开启瘦身导致 MaterialButton 崩溃）
        echo "" >> proguard-rules.pro
        echo "# 自动注入防 Material 混淆" >> proguard-rules.pro
        echo "-keep class com.google.android.material.** {*;}" >> proguard-rules.pro
        echo "-dontwarn com.google.android.material.**" >> proguard-rules.pro

    # 3. 此时已经处于源码目录内，只需去除路径依赖执行命令即可
    - name: 编译 Debug APK
      run: |
        ./gradlew clean
        ./gradlew assembleDebug > ../build.log 2>&1
        EXIT_CODE=$?
        set -e
        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ 编译失败了！你可以到页面底部下载 'build-log-txt'。"
          exit $EXIT_CODE
        fi

    - name: 上传编译日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-txt
        path: build.log  # 因为日志在前面写到了上一级，所以这里是 ../build.log？嗯这里有点歧义，我会在YML里确保路径一致。

    # 4. 查找产出物（直接在内部找）
    - name: 查找并定位 APK 文件
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          echo "✅ 成功找到 APK 文件：$APK_FILE"
          mkdir -p app/build/outputs/apk/debug
          cp "$APK_FILE" app/build/outputs/apk/debug/legado-build.apk
        else
          echo "❌ 找不到 APK 文件！"
          exit 1
        fi

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: legado-debug-apk
        path: app/build/outputs/apk/debug/legado-build.apk

    - name: 打包修改好的纯净源码
      run: |
        zip -r ../modified-sources.zip . -x "*.git*" -x ".github/*" -x "*.zip" -x "**/build/*" -x "app/build/*" -x ".gradle/*" -x ".idea/*" -x ".kotlin/*"

    - name: 上传修改后的源码包
      uses: actions/upload-artifact@v4
      with:
        name: legado-modified-sources
        path: ../modified-sources.zip

    # 5. 推回源码（同样需要切出源码目录再推）
    - name: 将修改后的源码推回 GitHub 仓库
      run: |
        cd ..
        git config --global user.name "github-actions[bot]"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "自动构建成功：强制覆盖网页源码 [skip ci]" || echo "没有检测到文件变动，跳过提交"
        git push -f origin source
